# ============================================================
# Nginx Core 설정
# ============================================================

# 실행 사용자 (기본값: nginx 또는 nobody)
# 보안: 권한이 제한된 전용 사용자로 실행
user nginx;

# Worker 프로세스 수 (기본값: 1)
# 권장: CPU 코어 수와 동일하게 설정 = 8개
# auto는 자동으로 CPU 코어 수를 감지
worker_processes auto;

# 에러 로그 파일 위치 및 레벨
# 레벨: debug, info, notice, warn, error, crit, alert, emerg
# 기본값: error_log logs/error.log error;
error_log /var/log/nginx/error.log notice;

# PID 파일 위치 (기본값: logs/nginx.pid)
# Nginx 마스터 프로세스의 PID를 저장
pid /run/nginx.pid;

# Worker 프로세스당 열 수 있는 최대 파일 디스크립터 수
# 기본값: OS 제한(보통 1024)
# 계산: worker_connections * 2 + 여유분
# 설명: 클라이언트 연결 + 백엔드 연결 + 로그 파일 등을 위해 필요
# 64GB 환경에서는 65535로 충분히 여유있게 설정
worker_rlimit_nofile 65535;


# ============================================================
# Events 블록: 연결 처리 방식
# ============================================================
events {
    # Worker 프로세스당 최대 동시 연결 수 (기본값: 512 또는 1024)
    # 계산: 
    #   - 64GB RAM에서 약 40GB 사용 가능 (OS + Nginx)
    #   - 연결당 메모리: ~10KB
    #   - 이론적 최대: 40GB / 10KB = 4,000,000 연결
    #   - 실제 권장: CPU와 메모리 균형 고려
    # 8 core * 4096 = 32,768 동시 연결 처리 가능
    worker_connections 4096;
    
    # 연결 처리 방식 (기본값: OS 의존적)
    # epoll: Linux에서 가장 효율적 (2.6+ 커널)
    # kqueue: FreeBSD/macOS
    # select: 기본값 (비효율적)
    # 설명: epoll은 대량 연결 처리에 O(1) 성능
    use epoll;
    
    # 한 번에 여러 연결 수락 (기본값: off)
    # on으로 설정 시 성능 향상 (특히 높은 부하에서)
    # 설명: Worker가 깨어날 때 큐의 모든 연결을 한 번에 수락
    multi_accept on;
}


# ============================================================
# HTTP 블록: 웹 서버 설정
# ============================================================
http {
    # MIME 타입 정의 파일 포함
    # 파일 확장자별 Content-Type 매핑
    include /etc/nginx/mime.types;
    
    # 알 수 없는 파일 타입의 기본 MIME 타입 (기본값: text/plain)
    default_type application/octet-stream;

    # ============================================================
    # 로깅 설정
    # ============================================================
    
    # 로그 포맷 정의
    # $remote_addr: 클라이언트 IP
    # $request_time: 요청 처리 시간(초)
    # $upstream_*: 백엔드 응답 시간 분석용
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'upstream=$upstream_addr';  

    # 액세스 로그 파일 위치 (기본값: logs/access.log)
    # 주의: 높은 트래픽에서는 I/O 병목 가능 (off 또는 buffer 고려)
    access_log /var/log/nginx/access.log main;
    # 성능 최적화 옵션:
    # access_log /var/log/nginx/access.log main buffer=32k;
    # access_log off; # 로깅 비활성화 (최고 성능)

    # ============================================================
    # 성능 최적화: 파일 전송
    # ============================================================
    
    # sendfile 시스템 콜 사용 (기본값: off)
    # on: 커널 공간에서 직접 파일 전송 (Zero-copy)
    # 설명: 정적 파일 전송 시 user space 복사 생략으로 성능 향상
    sendfile on;
    
    # TCP_CORK 소켓 옵션 사용 (기본값: off)
    # on: 여러 패킷을 모아서 한 번에 전송 (sendfile과 함께 사용)
    # 설명: 네트워크 오버헤드 감소 (헤더 + 파일을 하나의 패킷으로)
    tcp_nopush on;
    
    # TCP_NODELAY 소켓 옵션 사용 (기본값: on)
    # on: Nagle 알고리즘 비활성화, 작은 패킷 즉시 전송
    # 설명: 동적 컨텐츠에서 지연 최소화 (keepalive 연결에 적용)
    tcp_nodelay on;

    # ============================================================
    # 타임아웃 설정
    # ============================================================
    
    # Keep-Alive 연결 유지 시간 (기본값: 75초)
    # 설명: 클라이언트와의 연결을 재사용하여 TCP 핸드셰이크 오버헤드 감소
    keepalive_timeout 65;
    
    # 클라이언트 본문(body) 읽기 타임아웃 (기본값: 60초)
    # 설명: POST 요청 등에서 데이터 전송 중 타임아웃
    client_body_timeout 60;
    
    # 클라이언트 헤더 읽기 타임아웃 (기본값: 60초)
    # 설명: HTTP 헤더 수신 대기 시간
    client_header_timeout 60;
    
    # 클라이언트 응답 전송 타임아웃 (기본값: 60초)
    # 설명: 클라이언트가 응답을 읽지 않을 때 연결 종료
    send_timeout 60;

    # ============================================================
    # 버퍼 크기 설정 (64GB RAM 환경 최적화)
    # ============================================================
    
    # 클라이언트 본문 버퍼 크기 (기본값: 8k 또는 16k)
    # 설명: POST 데이터를 메모리에 버퍼링
    # 이 크기 초과 시 임시 파일 사용 (client_body_temp_path)
    # 64GB 환경에서는 128k로 충분
    client_body_buffer_size 128k;
    
    # 클라이언트 최대 본문 크기 (기본값: 1m)
    # 설명: 파일 업로드 최대 크기 제한
    # 초과 시 413 (Request Entity Too Large) 에러
    client_max_body_size 50m;
    
    # 클라이언트 헤더 버퍼 크기 (기본값: 1k)
    # 설명: 대부분의 요청 헤더를 수용할 크기
    client_header_buffer_size 4k;
    
    # 큰 클라이언트 헤더를 위한 버퍼 (기본값: 4 8k)
    # 형식: <개수> <크기>
    # 설명: Cookie가 많거나 긴 URL의 경우 사용
    # 총 버퍼: 4 * 16k = 64k
    large_client_header_buffers 4 16k;
    
    # 출력 버퍼 설정 (기본값: 32k 또는 페이지 크기)
    # 설명: 백엔드 응답을 클라이언트에 전송하기 전 버퍼링
    output_buffers 2 32k;
    
    # 출력 지연 설정 (기본값: 1460 bytes, MTU 크기)
    # 설명: 이 크기만큼 데이터가 쌓이면 전송
    postpone_output 1460;

    # ============================================================
    # Gzip 압축 설정 (CPU 8 core 활용)
    # ============================================================
    
    # Gzip 압축 활성화 (기본값: off)
    # 설명: 텍스트 기반 컨텐츠를 압축하여 대역폭 절약
    # 주의: CPU 사용량 증가하지만 8 core면 충분히 여유
    gzip on;
    
    # Vary: Accept-Encoding 헤더 추가 (기본값: off)
    # 설명: 프록시 캐시가 압축/비압축 버전을 구분하도록 함
    gzip_vary on;
    
    # 프록시된 요청도 압축 (기본값: off)
    # any: 모든 프록시 요청 압축
    # 기타: expired, no-cache, no-store, private, no_last_modified, no_etag, auth
    gzip_proxied any;
    
    # 압축 레벨 (기본값: 1, 범위: 1-9)
    # 1: 최소 압축, 최고 속도
    # 9: 최대 압축, 최저 속도
    # 6: 압축률과 CPU 사용의 균형 (권장)
    # 8 core 환경에서는 6이 적절
    gzip_comp_level 6;
    
    # 압축할 MIME 타입 (기본값: text/html만)
    # 설명: text/html은 기본으로 포함되므로 명시 불필요
    # 이미지, 비디오는 이미 압축되어 있으므로 제외
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;
    
    # 특정 브라우저에서 Gzip 비활성화 (기본값: 없음)
    # 설명: IE 6 이하 버전은 Gzip 버그 있음
    gzip_disable "MSIE [1-6]\.";
    
    # 최소 압축 파일 크기 (기본값: 20 bytes)
    # 설명: 작은 파일은 압축 오버헤드가 더 클 수 있음
    gzip_min_length 1000;

    # ============================================================
    # 보안 설정
    # ============================================================
    
    # Nginx 버전 숨기기 (기본값: on)
    # off: 에러 페이지와 헤더에서 버전 정보 제거
    # 설명: 보안 취약점 공격 방지
    server_tokens off;
    
    # X-Frame-Options 헤더 (기본값: 없음)
    # SAMEORIGIN: 동일 도메인에서만 iframe 허용
    # DENY: 모든 iframe 차단
    # 설명: 클릭재킹(Clickjacking) 공격 방지
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # X-Content-Type-Options 헤더 (기본값: 없음)
    # nosniff: MIME 타입 스니핑 방지
    # 설명: 브라우저가 Content-Type을 무시하고 파일 내용 분석하는 것 차단
    add_header X-Content-Type-Options "nosniff" always;
    
    # X-XSS-Protection 헤더 (기본값: 없음)
    # 1; mode=block: XSS 필터 활성화 및 차단
    # 설명: 구형 브라우저의 XSS 방어 (최신 브라우저는 CSP 사용)
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================================
    # Upstream: 백엔드 서버 로드밸런싱
    # ============================================================
    upstream tomcat_backend {
        # 로드밸런싱 알고리즘 (기본값: round-robin)
        # least_conn: 활성 연결이 가장 적은 서버로 전달
        # ip_hash: 클라이언트 IP 기반 고정 (세션 고정)
        # 설명: JWT 사용 시 least_conn이 최적 (Stateless)
        least_conn;
        
        # 백엔드 서버 1
        # max_fails: 이 횟수만큼 실패 시 서버를 비활성화 (기본값: 1)
        # fail_timeout: 비활성화 시간 (기본값: 10초)
        # weight: 가중치, 높을수록 많은 요청 받음 (기본값: 1)
        server 172.100.100.1:8080 max_fails=3 fail_timeout=30s weight=1;
        
        # 백엔드 서버 2
        server 172.100.100.2:8080 max_fails=3 fail_timeout=30s weight=1;
        
        # Keepalive 연결 풀 크기 (기본값: 없음, 0)
        # 설명: Nginx와 백엔드 간 연결 재사용 (TCP 핸드셰이크 오버헤드 감소)
        # 계산: Worker 당 4~8개 * 8 worker = 32개 적절
        keepalive 32;
        
        # Keepalive 연결 유지 시간 (기본값: 60초)
        # 설명: 유휴 연결을 이 시간동안 유지
        keepalive_timeout 60s;
        
        # Keepalive 연결당 최대 요청 수 (기본값: 100)
        # 설명: 이 횟수만큼 요청 처리 후 연결 종료 및 재생성
        keepalive_requests 100;
    }

    # 추가 설정 파일 포함 (기본값: 없음)
    include /etc/nginx/conf.d/*.conf;

    # ============================================================
    # HTTPS 서버 블록 (메인)
    # ============================================================
    server {
        # 포트 443 (HTTPS) 리스닝
        # ssl: SSL/TLS 활성화
        # http2: HTTP/2 프로토콜 활성화 (기본값: off)
        # 설명: HTTP/2는 멀티플렉싱, 헤더 압축으로 성능 향상
        listen 443 ssl http2;
        
        # 서버 도메인 이름 (기본값: "")
        server_name smartcc-call.wooriib.com;

        # ============================================================
        # SSL/TLS 설정
        # ============================================================
        
        # SSL 인증서 (공개키)
        ssl_certificate /etc/nginx/ssl/star_wooriib_com_cert.pem;
        
        # SSL 개인키
        ssl_certificate_key /etc/nginx/ssl/star_wooriib_com_key.pem;
        
        # SSL 개인키 비밀번호 파일
        ssl_password_file /etc/nginx/ssl/password.txt;

        # SSL 프로토콜 버전 (기본값: TLSv1 TLSv1.1 TLSv1.2)
        # 권장: TLSv1.2, TLSv1.3만 사용 (보안)
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # SSL 암호화 스위트 (기본값: HIGH:!aNULL:!MD5)
        # ECDHE: 완전 순방향 비밀성(PFS) 지원
        # GCM/CHACHA20-POLY1305: AEAD 암호화 (빠르고 안전)
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        
        # 서버 암호화 스위트 우선 (기본값: off)
        # off: 클라이언트가 선호하는 암호화 사용 (TLS 1.3에서는 무시됨)
        ssl_prefer_server_ciphers off;
        
        # SSL 세션 캐시 (기본값: none)
        # shared:SSL:10m: 모든 워커가 공유하는 10MB 캐시
        # 설명: SSL 핸드셰이크 재사용으로 CPU/시간 절약
        # 10MB = 약 40,000 세션 저장 가능
        ssl_session_cache shared:SSL:10m;
        
        # SSL 세션 타임아웃 (기본값: 5분)
        # 설명: 캐시된 세션의 유효 시간
        ssl_session_timeout 10m;
        
        # SSL 세션 티켓 (기본값: on)
        # off: 티켓 비활성화 (보안상 권장)
        # 설명: 세션 재개 메커니즘 (PFS 위반 가능성)
        ssl_session_tickets off;
        
        # OCSP Stapling 활성화 (기본값: off)
        # 설명: 인증서 유효성 검증을 서버가 대신 수행 (성능 향상)
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # DNS 리졸버 (OCSP용)
        # Google Public DNS 사용
        # valid=300s: DNS 캐시 5분
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ============================================================
        # 정적 파일 루트
        # ============================================================
        
        # 문서 루트 디렉토리 (기본값: html)
        root /product/smartcc/frontend;
        
        # 디렉토리 인덱스 파일 (기본값: index.html)
        index index.html index.htm;

        # ============================================================
        # Location: 정적 파일 캐싱
        # ============================================================
        
        # 정적 리소스 (이미지, CSS, JS 등)
        # ~*: 대소문자 구분 없는 정규식 매칭
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            # 만료 시간 (기본값: 없음)
            # 1y = 1년
            # 설명: 브라우저 캐시 지시
            expires 1y;
            
            # Cache-Control 헤더 추가
            # public: 공유 캐시 허용
            # immutable: 변경되지 않음 (재검증 불필요)
            add_header Cache-Control "public, immutable";
            
            # 액세스 로그 비활성화 (성능 향상)
            access_log off;
        }

        # ============================================================
        # Location: SSE Push 엔드포인트 (특별 처리 필요!)
        # ============================================================
        location /api/common/push {
            # 백엔드 프록시
            proxy_pass http://tomcat_backend;
            
            # HTTP 버전 (기본값: 1.0)
            # 1.1: Keepalive 및 청크 인코딩 지원
            proxy_http_version 1.1;
            
            # Connection 헤더 (기본값: close)
            # 빈 문자열: Keepalive 활성화
            proxy_set_header Connection "";
            
            # ⚠️ SSE 필수 설정: 버퍼링 비활성화
            # 기본값: on
            # off: 실시간 스트리밍 필수 (버퍼링하면 메시지 지연)
            proxy_buffering off;
            
            # 프록시 캐시 비활성화 (기본값: 상속)
            # 설명: SSE는 캐시 불가
            proxy_cache off;
            
            # ⚠️ SSE 필수: 타임아웃 증가
            # proxy_read_timeout (기본값: 60초)
            # 설명: SSE는 장시간 연결 유지 (1시간)
            proxy_read_timeout 3600s;
            
            # 백엔드 연결 타임아웃 (기본값: 60초)
            proxy_connect_timeout 10s;
            
            # 백엔드 전송 타임아웃 (기본값: 60초)
            proxy_send_timeout 3600s;
            
            # 헤더 전달 (기본값: 없음)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # JWT 토큰 전달 (필수!)
            proxy_set_header Authorization $http_authorization;
            
            # 쿠키 전달
            proxy_set_header Cookie $http_cookie;
            
            # SSE 헤더
            proxy_set_header Accept "text/event-stream";
            proxy_set_header Cache-Control "no-cache";
        }

        # ============================================================
        # Location: 일반 API
        # ============================================================
        location /api/ {
            proxy_pass http://tomcat_backend;
            
            # Keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # 헤더 전달
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            
            # 타임아웃 (일반 API용)
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 버퍼링 설정 (기본값: on)
            # on: 백엔드 응답을 버퍼링 후 전송 (성능 향상)
            proxy_buffering on;
            
            # 프록시 버퍼 크기 (기본값: 4k 또는 8k)
            # 설명: 백엔드 응답 헤더를 위한 버퍼
            proxy_buffer_size 4k;
            
            # 프록시 버퍼 수와 크기 (기본값: 8 4k 또는 8 8k)
            # 설명: 백엔드 응답 본문을 위한 버퍼
            # 총 32k = 8 * 4k
            proxy_buffers 8 4k;
            
            # 프록시 busy 버퍼 크기 (기본값: 8k 또는 16k)
            # 설명: 클라이언트로 전송 중인 버퍼 크기
            proxy_busy_buffers_size 8k;
            
            # 장애 조치 (기본값: error timeout)
            # 설명: 지정된 조건에서 다음 서버로 재시도
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            
            # 재시도 횟수 (기본값: 0 = 무제한)
            # 설명: 최대 2번까지만 재시도
            proxy_next_upstream_tries 2;
            
            # 재시도 타임아웃 (기본값: 0 = 무제한)
            # 설명: 10초 안에 재시도 완료
            proxy_next_upstream_timeout 10s;
        }

        # ============================================================
        # Location: 로그인
        # ============================================================
        location /login {
            proxy_pass http://tomcat_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # Location: WebSocket (향후 확장)
        # ============================================================
        location /ws/ {
            proxy_pass http://tomcat_backend;
            
            # WebSocket 업그레이드 헤더
            # $http_upgrade: 클라이언트의 Upgrade 헤더 값
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # WebSocket 장시간 연결
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # ============================================================
        # Location: React SPA
        # ============================================================
        location / {
            # try_files: 파일 존재 확인 후 fallback
            # $uri: 요청 URI의 파일 확인
            # $uri/: 디렉토리로 확인
            # /index.html: 없으면 index.html (SPA 라우팅)
            try_files $uri $uri/ /index.html;
            
            # SPA는 캐시하지 않음 (배포 시 즉시 반영)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ============================================================
        # Location: 헬스 체크
        # ============================================================
        location /health {
            # 로그 비활성화
            access_log off;
            
            # 200 OK 응답 (기본값: 없음)
            return 200 "healthy\n";
            
            # Content-Type 헤더
            add_header Content-Type text/plain;
        }

        # ============================================================
        # 에러 페이지
        # ============================================================
        
        # 50x 에러 페이지 (기본값: 없음)
        error_page 500 502 503 504 /50x.html;
        
        # 에러 페이지 위치
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ============================================================
    # HTTP to HTTPS 리다이렉션
    # ============================================================
    server {
        # 포트 80 (HTTP) 리스닝 (기본값: 80)
        listen 80;
        server_name smartcc-call.wooriib.com;

        # 헬스 체크는 HTTP 허용 (로드밸런서용)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 나머지는 HTTPS로 리다이렉트
        location / {
            # 301: 영구 리다이렉트 (기본값: 302 임시)
            # $host: 현재 호스트
            # $request_uri: 원본 URI + 쿼리 문자열
            return 301 https://$host$request_uri;
        }
    }
}