#################################
# TOMCAT
#################################
server:
  shutdown: graceful
  servlet:
    context-path: ""
    session:
      timeout: 1800
      cookie:
        #        domain: localhost
        name: MSESSION_ID
        http-only: true
        secure: false
  error:
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: false
  compression:
    # html, css compression
    enabled: false
  tomcat:
    remoteip:
      enabled: true
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.1[6-9]\.\d{1,3}\.\d{1,3}|172\.2[0-9]\.\d{1,3}\.\d{1,3}|172\.3[0-1]\.\d{1,3}\.\d{1,3}|^127\.\d{1,3}\.\d{1,3}\.\d{1,3}$
      # trusted-proxies:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For
      proxies-header: X-Forwarded-By

spring:
  # ===============================
  # 기본 프로파일 설정
  # ===============================
  profiles:
    active: local  # 기본 프로파일(로컬 개발)
    
  # ===============================
  # Jasypt 암호화 설정
  # ===============================
  config:
    import:
      - optional:classpath:jasypt-config.yml

  main:
    allow-bean-definition-overriding: true

  pid:
    file: m-project.pid
  #   lifecycle:
  #      timeout-per-shutdown-phase: 30s
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: false

  servlet:
    # file upload size
    multipart.max-file-size: 500MB
    # file upload size
    multipart.max-request-size: 500MB

  jpa:
    open-in-view: false
    
  datasource:
    main:
      hikari:
        maximum-pool-size: 200
        ## PostgreSQL
        driver-class-name: "org.postgresql.Driver"

        # auto-commit은 Spring 트랜잭션 관리에 맡김 (기본값: true)
        # 커넥션 타임아웃: 120초 (2분)
        connection-timeout: 120000
        # idle-timeout: 30초
        #idle-timeout: 30000
        # 커넥션 최대 수명: 200초 (약 3분)
        max-lifetime: 200000
        connection-test-query: "SELECT 1"

      hibernate:
        property:
          "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
          "[hibernate.hbm2ddl.auto]": none
          "[hibernate.cache.use_second_level_cache]": false
          "[hibernate.cache.use_query_cache]": false
          "[hibernate.physical_naming_strategy]": org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  mail:
    # [메일 발송] host 를 하드코딩하지 않는다 — 사내 SMTP 릴레이로 옮길 수 없게 된다.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # ★ 저장소에 평문 커밋 금지. 환경변수로 주입한다(.env).
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # 사내 릴레이가 무인증(내부망 IP 허용)이면 MAIL_SMTP_AUTH=false 로 끈다.
          auth: ${MAIL_SMTP_AUTH:true}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

#################################
# LOGGING
#################################
logging:
  pattern:
    console: "%clr{%d{yyyy-MM-dd HH:mm:ss}}{faint} %highlight{[%-5p]}{FATAL=bg_red, ERROR=red, INFO=green, DEBUG=blue, TRACE=bg_yellow} %clr{%pid}{magenta} %clr{---}{faint} [%15.15t] %clr{%-40.40c{1.}}{cyan} %clr{:}{faint} %m%n%xwEx"
  level:
    root: info
    jdbc:
      sqlonly: off      # 쿼리 로그 출력 안 함
      resultset: off    # ResultSet 로그 출력 안 함
      audit: off        # Audit 로그 출력 안 함
      sqltiming: error  # SQL 타이밍은 에러만
    p6spy: off          # p6spy 로그 출력 안 함
    "[com.p6spy]": off  # p6spy 패키지 로그 출력 안 함
    buttle.apptpl: info



#################################
# SWAGGER
#################################
springdoc:
  # [보안] 문서 <생성> 스위치. 기본은 꺼 둔다 — 켜는 환경에서만 명시적으로 켠다.
  #
  #  ★ swagger-ui.enabled 로는 못 막는다. 둘은 별개 속성이고, springdoc 은 이 값이 없으면
  #    <켜진 것으로> 본다(SpringDocConfiguration 의 @ConditionalOnProperty matchIfMissing = true).
  #    그래서 아래 swagger-ui.enabled: false 만 두었을 때 화면은 닫혔지만
  #    /v3/api-docs 는 그대로 응답했다 — dev 실측 200 · 270,543B(전체 엔드포인트 목록).
  #
  #  운영 프로파일 설정이 저장소에 없으므로 <기본값이 곧 운영값>이다. 기본을 열어 두면
  #  아무도 켜지 않았는데 열려 있는 상태가 된다. SecurityConfig 의 스웨거 permitAll 도
  #  이 값에 걸어 두어, 문서를 끈 환경에서는 경로도 열리지 않는다.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui
    operations-sorter: alpha
    filter: false
    default-models-expand-depth: -1
    default-model-expand-depth: -1
  packages-to-scan: buttle.apptpl



#####################################################
# 시스템 설정
#####################################################
system:
  # 파일 ID·업로드 폴더의 접두어가 된다(AiccFileIdGenerator·FileAttachmentService).
  #  ★ 프로젝트마다 바꾼다 — 두 시스템이 같은 스토리지를 쓰면 폴더가 섞인다.
  code: ${SYSTEM_CODE:apptpl}
  # 기본 조직(회원사) ID. cmpt_cmpy_inf 의 시드 행과 같아야 한다(db/sql/V2__seed_base_data.sql).
  company-id: ${SYSTEM_COMPANY_ID:00000}



#####################################################
# 서비스기본설정
#####################################################
svc-env:
  login-url: "/"
  csrf: false
  csrf-except-list:
    - "/login"
    - "/logout"
#    - "/**"
  # [구설정] api-authentication 은 api-auth-policy 로 대체됐다. 아래 정책이 설정돼 있으면 무시된다.
  # (호환을 위해 남겨 둔다 — 값이 있고 정책이 없을 때만 true→ENFORCE / false→OFF 로 해석)
  api-authentication: false
  # API 권한 검사 정책 — OFF / AUDIT / ENFORCE
  #  OFF     : 검사하지 않는다(종전 동작). 로그인만 하면 모든 관리자 API 호출 가능.
  #  AUDIT   : 검사하되 통과시키고 경고만 남긴다. 로그의 URI 를 프로그램-권한 매핑에 등록하는 단계.
  #  ENFORCE : 매핑에 없거나 익명이면 차단한다.
  # 로컬·개발은 AUDIT, 운영은 ENFORCE. (운영 프로파일에서 ENFORCE 가 아니면 기동을 거부한다)
  api-auth-policy: ${API_AUTH_POLICY:AUDIT}

  cors:
    # ★ '*' 이면 SecurityConfig 가 allowCredentials 를 끄지만, 모든 origin 을 반사하는 것 자체는 변하지 않는다.
    #  로컬은 편의를 위해 '*' 를 두고, <운영·검증 환경에서는 반드시 실제 origin 으로 덮는다>(쉼표 구분).
    origins: ${SVC_ENV_CORS_ORIGINS:*}
    headers:
      - "Content-Disposition"
      - "Content-Language"
      - "Content-Transfer-Encoding"
      - "Content-Type"
    methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    pattern: "/**"
 
  login-attempt:
    initial-pswd: 1234
    initial-pswd-days: 60
    allow-duplication-login: true # 중복로그인 허용 여부
    duplicate-login-time: 120000 # 중복로그인 체크 2분(120초)
    login-fail-count: 5 # 로그인 실패 횟수

  jwt:
    # ★ 저장소에 평문 커밋 금지. 환경변수로 주입한다(.env).
    secret: ${APPTPL_JWT_SECRET:}
    access-token-validity-in-seconds: 2592000  # 30일 (개발용 연장)
    refresh-token-validity-in-seconds: 7776000  # 90일        
    anonymous-mode: false # 익명 모드 사용 여부 - 익명 모드 사용 시 토큰 없이 접근 가능
    cookie-secure: false # 쿠키 보안 여부 - false 시 HTTP로 전송 ([오타수정] cookie-secure1→cookie-secure: 바인딩 안 되던 키를 정정. 운영 HTTPS 는 true 로.)

#################################
# 마스킹
#################################
# 개인정보 마스킹 스위치는 corebase 에 있다 — `corebase.pii.masking-enabled` (기본 false).
#  ★ 마스킹 <대상>은 설정이 아니라 VO 필드의 @Pii 어노테이션이 정한다.
#  자세한 것은 docs/development-standard.md §6.

#################################
# 서비스 로깅
#################################
  log:
    use-personal-log: true
    use-api-log: true

# ===============================
# 시스템 설정
# ===============================
env:
  # ★ 저장소에 평문 커밋 금지. 환경변수로 주입한다(.env).
  aes-key: ${APPTPL_AES_KEY:}

# ===============================
# 애플리케이션 고유 설정
# ===============================
app:
  # ── 언어 ───────────────────────────────────────────────────────────────────
  #  코드표·메시지처럼 언어별 행을 가진 표를 «어느 언어로» 읽을지는 LocaleSupport 가 정한다 —
  #  요청의 Accept-Language 가 아래 supported 안에 있으면 그것, 아니면 default.
  #  ⛔ SQL 에 'ko' 를 박지 않는다. 두 번째 언어의 행이 들어오는 순간 조회가 두 행을 돌려준다.
  default-locale: ${DEFAULT_LOCALE:ko}
  supported-locales: ${SUPPORTED_LOCALES:ko,en}

  mail:
    # 발송 사용 여부. false 면 발송하지 않는다.
    enabled: ${MAIL_ENABLED:true}
    # 발신 주소(From). 인증 계정과 발신 명의는 별개다(사내 릴레이는 보통 무인증).
    #  비워 두면 spring.mail.username 으로 폴백한다.
    from: ${MAIL_FROM:}
    # ★ [개발 안전장치] 값이 있으면 원래 수신자를 <전부 버리고> 이 주소로만 보낸다.
    #  로컬에서는 반드시 자기 주소를 넣는다 — 비워 두면 발송 시험이 DB 의 실제 사용자에게 그대로 나간다.
    #  운영에는 설정하지 않는다(SecretsStartupValidator 가 운영 프로파일에서 기동을 거부한다).
    override-to: ${MAIL_OVERRIDE_TO:}

  sms:
    # 발신정보가 비어 있을 때 쓰는 기본값(사전등록된 발신번호여야 한다).
    #  비워 두면 채우지 않는다 — 없는 번호를 억지로 넣는 것보다 비어 있음이 드러나는 편이 낫다.
    default-sndr-telno: ${SMS_DEFAULT_SNDR_TELNO:}
    default-sndr-nm: ${SMS_DEFAULT_SNDR_NM:}

  # ---- 나가는 호출(S2S) 에 실을 키 — CompanyApiAdapter 가 X-Api-Key 로 보낸다 ----
  outbound-api-key: ${OUTBOUND_API_KEY:local-api-key}

  # ---- 들어오는 호출(S2S) 수신 인증 — CompanyApiAuthFilter ----
  # 부르는 쪽이 X-Api-Key 로 보내는 값과 같아야 한다.
  # ★ 기본값을 두지 않는다 — 설정 누락이 곧 무인증 개방이 되지 않게 하기 위한 것이다.
  internal-api-key: ${INTERNAL_API_KEY:}
  # AUDIT   : 키가 없거나 틀려도 통과시키고 경고만 남긴다(로컬·개발).
  # ENFORCE : 키가 없거나 틀리면 401 로 차단한다(운영).
  internal-api-auth-policy: ${INTERNAL_API_AUTH_POLICY:AUDIT}

# [장애기록] 이 앱이 «어느 서비스인가». logt_error_log.svc_cd 에 그대로 들어간다.
#  · 앱의 «정체»라 환경마다 달라지지 않는다 ⇒ 환경별 yml 이 아니라 여기다.
#  · ASCII 로 둔다. 코드값이지 표시용 이름이 아니다.
#  ⛔ 서버 «인스턴스» 식별자는 여기 두지 않는다 — 그건 배포가 주입한다.
#     앱에 박으면 한 이미지가 여러 서버로 나갈 때 전부 같은 값이 된다.
#
#  ★ 키 이름 `chatcall.service.code` 는 <corebase 라이브러리의 계약>이다
#    (micoai.corebase.failure.FailureRecorder 가 이 키를 읽는다). 이름은 바꾸지 말고
#    값만 이 프로젝트의 코드로 바꾼다.
chatcall:
  service:
    code: ${SERVICE_CODE:APPTPL}
